name: Build Android APK

# Builds a signed release APK from repo secrets. Nothing sensitive lives in
# the repo — every secret comes from GitHub Actions secrets and is decoded
# just-in-time on the runner.
#
# Trigger: manual (workflow_dispatch) + on tag push (v*).
#
# Required GitHub Actions secrets:
#   ANDROID_KEYSTORE_BASE64            - base64 of your release.keystore
#                                        (macOS/Linux: `base64 -i release.keystore | pbcopy`)
#   ANDROID_KEYSTORE_PASSWORD          - keystore password
#   ANDROID_KEY_ALIAS                  - key alias inside the keystore
#   ANDROID_KEY_PASSWORD               - key password
#   FIREBASE_GOOGLE_SERVICES_JSON_BASE64 - base64 of google-services.json
#                                          (`base64 -i firebase/google-services.json | pbcopy`)
#   FIREBASE_DATABASE_URL              - e.g. https://<project>-default-rtdb.firebaseio.com
#
# Add each under: repo → Settings → Secrets and variables → Actions → New secret.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle task to run'
        required: true
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: |
          # Retry npm ci — the registry occasionally drops connections (ECONNRESET)
          # on GitHub-hosted runners; a couple of retries recovers reliably.
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund; then
              exit 0
            fi
            echo "npm ci failed (attempt $attempt) — retrying in 15s..."
            sleep 15
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      - name: Write Firebase Android config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p firebase
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > firebase/google-services.json
          # Basic sanity check — must be valid JSON.
          node -e "JSON.parse(require('fs').readFileSync('firebase/google-services.json','utf8'))"

      - name: Write .env
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          if [ -z "$FIREBASE_DATABASE_URL" ]; then
            echo "::error::FIREBASE_DATABASE_URL secret is not set."
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}"
          } > .env

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p credentials
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > credentials/release.keystore
          test -s credentials/release.keystore

      - name: Write credentials.json
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "credentials/release.keystore",
                "keystorePassword": "${ANDROID_KEYSTORE_PASSWORD}",
                "keyAlias": "${ANDROID_KEY_ALIAS}",
                "keyPassword": "${ANDROID_KEY_PASSWORD}"
              }
            }
          }
          EOF

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Copy the keystore into the generated Android project.
          cp credentials/release.keystore android/app/release.keystore
          # Wire the release signingConfig via ~/.gradle/gradle.properties so
          # nothing sensitive lands on disk inside the repo.
          mkdir -p ~/.gradle
          {
            echo "LINEWATCH_UPLOAD_STORE_FILE=release.keystore"
            echo "LINEWATCH_UPLOAD_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "LINEWATCH_UPLOAD_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "LINEWATCH_UPLOAD_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> ~/.gradle/gradle.properties
          # Patch android/app/build.gradle to reference these properties.
          node scripts/patch-android-signing.cjs

      - name: Build with Gradle
        working-directory: android
        run: ./gradlew ${{ github.event.inputs.build_type || 'assembleRelease' }} --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH="$(find android/app/build/outputs/apk -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced."
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linewatch-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}

      - name: Scrub secrets from workspace
        if: always()
        run: |
          rm -f credentials.json .env
          rm -rf credentials firebase/google-services.json firebase/GoogleService-Info.plist
          rm -f ~/.gradle/gradle.properties
